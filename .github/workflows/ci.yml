name: ci
on:
  push:
  pull_request:
# The workflow only reads the repository and reports through the checks API that
# GITHUB_TOKEN grants by default. Nothing here writes to the repo, so drop every
# other scope rather than inherit the repository default.
permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    env:
      CI: "1"   # tests/lua-check.sh fails instead of skipping when its runtime is missing
    steps:
      # Pinned to a full commit SHA: a tag can be moved to different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Qt is pinned, not taken from apt: Qt 6.9 is the compatibility floor (ADR-0004),
      # because SoftShadow.qml's RectangularShadow is 6.9+, and the runner image's apt Qt
      # (6.4 on ubuntu-24.04) is both older than the floor and unpinned. `6.9.*` resolves
      # to the newest 6.9 patch release; install-deps pulls the GL/X libraries the
      # offscreen platform still links against.
      - name: Install Qt 6.9 (the compatibility floor)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.9.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          install-deps: 'true'
          cache: 'true'
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Run Tier 1 logic tests (offscreen) + Lua chunk suite
        # The runners look for a distro qmltestrunner; name the pinned one explicitly.
        env:
          QMLTESTRUNNER: ${{ env.QT_ROOT_DIR }}/bin/qmltestrunner
        run: bash tests/run.sh
      # The knowledge base has its own gates: frontmatter, wikilinks, orphans, and the
      # validators' unit tests. Nothing in tests/run.sh checks them, so a broken wikilink
      # or a block-scalar frontmatter value would otherwise land silently.
      - name: Validate the knowledge base and run the KB tooling tests
        run: make validate && make test
