name: ci
on:
  push:
  pull_request:
# The workflow only reads the repository and reports through the checks API that
# GITHUB_TOKEN grants by default. Nothing here writes to the repo, so drop every
# other scope rather than inherit the repository default.
permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    env:
      CI: "1"   # tests/lua-check.sh fails instead of skipping when its runtime is missing
    steps:
      # Pinned to a full commit SHA: a tag can be moved to different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Qt6 Quick test tooling and Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qml6-module-qttest qml6-module-qtquick qml6-module-qtqml \
            qml6-module-qtqml-workerscript qml6-module-qtquick-window \
            qt6-declarative-dev-tools libqt6quick6 libgl1 lua5.4
      - name: Run Tier 1 logic tests (offscreen) + Lua chunk suite
        run: bash tests/run.sh
