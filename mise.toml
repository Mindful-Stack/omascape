[tasks.test]
description = "Tier 1: layout and offscreen Qt drag tests, no compositor"
run = "bash tests/run.sh"

[tasks.test-integration]
description = "Tier 2: nested-Hyprland integration (local; needs Hyprland + Quickshell + foot + jq)"
run = "bash tests/integration/move.sh"

# Named after Omarchy's own `omarchy dev link` / `dev unlink` / `dev status`, which
# do the same three things one level up.
[tasks."dev:link"]
description = "Point the live Omarchy plugin dir at this worktree and restart the shell"
run = "bash scripts/dev-link.sh"

[tasks."dev:unlink"]
description = "Restore the ordinary clone install and restart the shell"
run = "bash scripts/dev-link.sh --unlink"

[tasks."dev:status"]
description = "Show which checkout the live plugin dir points at, and whether the running shell is it"
run = "bash scripts/dev-link.sh --status"

# The release train (ADR-0010). Builds the runtime-only tree from this branch and records it
# as a commit on `main`, which is what `omarchy plugin add` clones.
[tasks."release:publish"]
description = "Build the published plugin tree from dev and record it on main"
run = "bash scripts/publish.sh"
